<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoSub-KZ — Видеоға қазақша субтитр</title>
<style>
  :root {
    --bg: #0f1220;
    --card: #171b2e;
    --accent: #4f8cff;
    --accent-2: #38d39f;
    --text: #e8eaf2;
    --muted: #9198b5;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #0f1220 0%, #171b2e 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px;
    padding: 36px;
    max-width: 560px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 22px;
    margin: 0 0 6px;
  }
  p.subtitle {
    color: var(--muted);
    margin: 0 0 28px;
    font-size: 14px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input[type="text"], select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    background: #10131f;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  input[type="text"]:focus, select:focus {
    border-color: var(--accent);
  }
  .row {
    display: flex;
    gap: 12px;
  }
  .row > div { flex: 1; }
  button {
    margin-top: 26px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0f1220;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  #status {
    margin-top: 18px;
    font-size: 14px;
    color: var(--muted);
    min-height: 20px;
  }
  #status.error { color: var(--error); }
  #status.success { color: var(--accent-2); }
  .download-link {
    display: inline-block;
    margin-top: 12px;
    padding: 10px 16px;
    border-radius: 8px;
    background: rgba(56, 211, 159, 0.12);
    color: var(--accent-2);
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
  }
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <h1>🎬 AutoSub-KZ</h1>
    <p class="subtitle">Видео сілтемесін қойыңыз — жүйе автоматты қазақша субтитр (.srt) жасайды.</p>

    <label for="video_url">Видео сілтемесі</label>
    <input type="text" id="video_url" placeholder="https://www.youtube.com/watch?v=..." />

    <div class="row">
      <div>
        <label for="source_language">Бастапқы тіл</label>
        <select id="source_language">
          <option value="">Автоанықтау</option>
          <option value="en">Ағылшын</option>
          <option value="ru">Орыс</option>
          <option value="tr">Түрік</option>
          <option value="kk">Қазақ (аудармасыз)</option>
        </select>
      </div>
      <div>
        <label for="whisper_model">Дәлдік деңгейі</label>
        <select id="whisper_model">
          <option value="tiny">Жылдам (tiny)</option>
          <option value="base" selected>Орташа (base)</option>
          <option value="small">Жоғары (small)</option>
          <option value="medium">Ең жоғары (medium)</option>
        </select>
      </div>
    </div>

    <button id="submitBtn" onclick="processVideo()">Субтитр жасау</button>

    <div id="status"></div>
  </div>

<script>
async function processVideo() {
  const videoUrl = document.getElementById('video_url').value.trim();
  const sourceLanguage = document.getElementById('source_language').value;
  const whisperModel = document.getElementById('whisper_model').value;
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('submitBtn');

  if (!videoUrl) {
    statusEl.className = 'error';
    statusEl.textContent = 'Алдымен видео сілтемесін енгізіңіз.';
    return;
  }

  btn.disabled = true;
  statusEl.className = '';
  statusEl.innerHTML = '<span class="spinner"></span>Өңделуде... Видео ұзақтығына байланысты бұл бірнеше минутқа созылуы мүмкін.';

  try {
    const response = await fetch('/process', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        video_url: videoUrl,
        source_language: sourceLanguage || null,
        whisper_model: whisperModel,
      }),
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.detail || 'Белгісіз қате пайда болды.');
    }

    statusEl.className = 'success';
    statusEl.innerHTML =
      `Дайын! ${data.segment_count} сегмент табылды.<br/>` +
      `<a class="download-link" href="${data.srt_download_url}" download>⬇ .srt файлын жүктеп алу</a>`;
  } catch (err) {
    statusEl.className = 'error';
    statusEl.textContent = 'Қате: ' + err.message;
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
